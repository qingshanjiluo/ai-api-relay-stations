<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI API 中转站检索与对比工具</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #3b82f6;
            --dark-bg: #0f172a;
            --dark-card-bg: #1e293b;
            --dark-text: #f1f5f9;
            --dark-text-secondary: #94a3b8;
            --dark-border-color: #334155;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-theme {
            background-color: var(--dark-bg);
            color: var(--dark-text);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary-color), #8b5cf6);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
        }

        .header-content {
            text-align: center;
            padding: 0 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            align-items: center;
        }

        body.dark-theme .controls {
            background: var(--dark-card-bg);
            border: 1px solid var(--dark-border-color);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 16px;
            transition: border-color 0.2s;
        }

        body.dark-theme .search-box input {
            background: var(--dark-bg);
            border-color: var(--dark-border-color);
            color: var(--dark-text);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-item label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        body.dark-theme .filter-item label {
            color: var(--dark-text-secondary);
        }

        .filter-item select {
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            min-width: 150px;
        }

        body.dark-theme .filter-item select {
            background: var(--dark-bg);
            border-color: var(--dark-border-color);
            color: var(--dark-text);
        }

        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--text-color);
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        body.dark-theme .theme-toggle {
            color: var(--dark-text);
        }

        .theme-toggle:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            text-align: center;
            transition: transform 0.2s;
        }

        body.dark-theme .stat-card {
            background: var(--dark-card-bg);
            border: 1px solid var(--dark-border-color);
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-card h3 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        body.dark-theme .stat-card p {
            color: var(--dark-text-secondary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 20px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        body.dark-theme .tab {
            background: var(--dark-card-bg);
            border-color: var(--dark-border-color);
            color: var(--dark-text-secondary);
        }

        .tab:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .tab.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        /* Table View */
        .table-container {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow-x: auto;
            margin-bottom: 30px;
        }

        body.dark-theme .table-container {
            background: var(--dark-card-bg);
            border: 1px solid var(--dark-border-color);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        body.dark-theme .table-header {
            border-bottom-color: var(--dark-border-color);
        }

        .table-header h2 {
            font-size: 1.5rem;
            color: var(--text-color);
        }

        body.dark-theme .table-header h2 {
            color: var(--dark-text);
        }

        .compare-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .compare-btn:hover {
            background: var(--primary-hover);
        }

        .compare-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        body.dark-theme th, body.dark-theme td {
            border-bottom-color: var(--dark-border-color);
        }

        th {
            background: #f1f5f9;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        body.dark-theme th {
            background: #0f172a;
        }

        th:hover {
            background: #e2e8f0;
        }

        body.dark-theme th:hover {
            background: #1e293b;
        }

        th .sort-icon {
            margin-left: 5px;
            opacity: 0.5;
        }

        th.sorted .sort-icon {
            opacity: 1;
            color: var(--primary-color);
        }

        tr:hover {
            background: #f8fafc;
        }

        body.dark-theme tr:hover {
            background: #0f172a;
        }

        .checkbox-cell {
            width: 40px;
        }

        .compare-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .category-large {
            background: #dbeafe;
            color: #1d4ed8;
        }

        body.dark-theme .category-large {
            background: #1e3a8a;
            color: #93c5fd;
        }

        .category-medium {
            background: #fef3c7;
            color: #92400e;
        }

        body.dark-theme .category-medium {
            background: #78350f;
            color: #fcd34d;
        }

        .category-open-source {
            background: #d1fae5;
            color: #065f46;
        }

        body.dark-theme .category-open-source {
            background: #064e3b;
            color: #6ee7b7;
        }

        .stability-stars {
            color: #f59e0b;
            font-size: 1.1rem;
        }

        .rate-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .rate-low {
            background: #d1fae5;
            color: #065f46;
        }

        body.dark-theme .rate-low {
            background: #064e3b;
            color: #6ee7b7;
        }

        .rate-medium {
            background: #fef3c7;
            color: #92400e;
        }

        body.dark-theme .rate-medium {
            background: #78350f;
            color: #fcd34d;
        }

        .rate-high {
            background: #fee2e2;
            color: #991b1b;
        }

        body.dark-theme .rate-high {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .veridrop-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .website-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .website-link:hover {
            text-decoration: underline;
        }

        /* Comparison View */
        .comparison-container {
            display: none;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 20px;
            margin-bottom: 30px;
        }

        body.dark-theme .comparison-container {
            background: var(--dark-card-bg);
            border: 1px solid var(--dark-border-color);
        }

        .comparison-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        body.dark-theme .comparison-header {
            border-bottom-color: var(--dark-border-color);
        }

        .comparison-header h2 {
            font-size: 1.5rem;
            color: var(--text-color);
        }

        body.dark-theme .comparison-header h2 {
            color: var(--dark-text);
        }

        .close-comparison {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 5px;
        }

        body.dark-theme .close-comparison {
            color: var(--dark-text-secondary);
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .comparison-card {
            background: var(--bg-color);
            border-radius: var(--radius-md);
            padding: 20px;
            border: 2px solid var(--border-color);
            transition: transform 0.2s;
        }

        body.dark-theme .comparison-card {
            background: var(--dark-bg);
            border-color: var(--dark-border-color);
        }

        .comparison-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-color);
        }

        .comparison-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        body.dark-theme .comparison-card-header {
            border-bottom-color: var(--dark-border-color);
        }

        .comparison-card-header h3 {
            font-size: 1.2rem;
            color: var(--text-color);
        }

        body.dark-theme .comparison-card-header h3 {
            color: var(--dark-text);
        }

        .remove-card {
            background: var(--danger-color);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .comparison-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        body.dark-theme .detail-item {
            border-bottom-color: var(--dark-border-color);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 500;
            color: var(--text-secondary);
        }

        body.dark-theme .detail-label {
            color: var(--dark-text-secondary);
        }

        .detail-value {
            font-weight: 600;
            color: var(--text-color);
        }

        body.dark-theme .detail-value {
            color: var(--dark-text);
        }

        /* Veridrop Section */
        .veridrop-section {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 20px;
            margin-bottom: 30px;
        }

        body.dark-theme .veridrop-section {
            background: var(--dark-card-bg);
            border: 1px solid var(--dark-border-color);
        }

        .veridrop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        body.dark-theme .veridrop-header {
            border-bottom-color: var(--dark-border-color);
        }

        .veridrop-header h2 {
            font-size: 1.5rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        body.dark-theme .veridrop-header h2 {
            color: var(--dark-text);
        }

        .veridrop-logo {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .veridrop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .veridrop-card {
            background: var(--bg-color);
            border-radius: var(--radius-md);
            padding: 20px;
            border: 2px solid var(--border-color);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        body.dark-theme .veridrop-card {
            background: var(--dark-bg);
            border-color: var(--dark-border-color);
        }

        .veridrop-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: #f59e0b;
        }

        .veridrop-rank {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .veridrop-card h3 {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 10px;
            padding-right: 40px;
        }

        body.dark-theme .veridrop-card h3 {
            color: var(--dark-text);
        }

        .veridrop-score {
            font-size: 2rem;
            font-weight: 700;
            color: #f59e0b;
            margin-bottom: 10px;
        }

        .veridrop-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.9rem;
        }

        .veridrop-detail {
            display: flex;
            justify-content: space-between;
        }

        .veridrop-detail-label {
            color: var(--text-secondary);
        }

        body.dark-theme .veridrop-detail-label {
            color: var(--dark-text-secondary);
        }

        .veridrop-detail-value {
            font-weight: 500;
            color: var(--text-color);
        }

        body.dark-theme .veridrop-detail-value {
            color: var(--dark-text);
        }

        /* Chart Section */
        .chart-section {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 20px;
            margin-bottom: 30px;
        }

        body.dark-theme .chart-section {
            background: var(--dark-card-bg);
            border: 1px solid var(--dark-border-color);
        }

        .chart-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        body.dark-theme .chart-header {
            border-bottom-color: var(--dark-border-color);
        }

        .chart-header h2 {
            font-size: 1.5rem;
            color: var(--text-color);
        }

        body.dark-theme .chart-header h2 {
            color: var(--dark-text);
        }

        .chart-container {
            height: 300px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 20px 0;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        body.dark-theme .chart-container {
            border-bottom-color: var(--dark-border-color);
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(to top, var(--primary-color), #8b5cf6);
            border-radius: 4px 4px 0 0;
            position: relative;
            transition: height 0.5s ease;
            min-height: 20px;
        }

        .chart-bar:hover {
            opacity: 0.9;
        }

        .chart-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        body.dark-theme .chart-label {
            color: var(--dark-text-secondary);
        }

        .chart-value {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-color);
        }

        body.dark-theme .chart-value {
            color: var(--dark-text);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 30px;
        }

        body.dark-theme .footer {
            border-top-color: var(--dark-border-color);
            color: var(--dark-text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .filter-item {
                width: 100%;
            }
            
            .filter-item select {
                width: 100%;
            }
            
            .comparison-grid {
                grid-template-columns: 1fr;
            }
            
            .veridrop-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                text-align: center;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        body.dark-theme .loading {
            color: var(--dark-text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        body.dark-theme .no-results {
            color: var(--dark-text-secondary);
        }

        /* Tooltip */
        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltip-text {
            visibility: hidden;
            width: 200px;
            background-color: #334155;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.8rem;
        }

        body.dark-theme .tooltip .tooltip-text {
            background-color: #64748b;

            let timeout;
            return function executedFunction(...args) {

                clearTimeout(timeout);
                timeout = setTimeout(later, wait);

                }
                
                if (valueA < valueB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valueA > valueB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });
        }

        // Helper functions
        function getRatingValue(stability) {
            const stars = stability.match(/⭐/g);
            return stars ? stars.length : 0;
        }

        function getRateValue(rateRange) {
            if (rateRange === '自建成本') return 0;
            if (rateRange === '按量付费') return 0;
            
            const match = rateRange.match(/(\d+\.?\d*)/);
            return match ? parseFloat(match[1]) : 0;
        }

        function getVeridropRank(stationName) {
            const veridropEntry = veridropData.top20_certified.find(item => 
                item.name.includes(stationName) || stationName.includes(item.name.split(' ')[0])
            );
            return veridropEntry ? veridropEntry.rank : 999;
        }

        function getCategoryName(category) {
            const names = {
                'large-scale': '大型中转站',
                'medium-scale': '中型中转站',
                'open-source': '开源方案',
                'small-scale': '小型/新兴'
            };
            return names[category] || category;
        }

        function getCategoryClass(category) {
            return `category-${category.replace('-scale', '')}`;
        }

        function getRateClass(rateRange) {
            if (rateRange === '自建成本' || rateRange === '按量付费') return 'rate-low';
            const rate = getRateValue(rateRange);
            if (rate <= 1.3) return 'rate-low';
            if (rate <= 1.5) return 'rate-medium';
            return 'rate-high';
        }

        function getVeridropInfo(stationName) {
            const entry = veridropData.top20_certified.find(item => 
                item.name.includes(stationName) || stationName.includes(item.name.split(' ')[0])
            );
            return entry;
        }

        // Render functions
        function renderStats() {
            const totalStations = stations.length;
            const largeScale = stations.filter(s => s.category === 'large-scale').length;
            const mediumScale = stations.filter(s => s.category === 'medium-scale').length;
            const openSource = stations.filter(s => s.category === 'open-source').length;
            
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <h3>${totalStations}</h3>
                    <p>总中转站数</p>
                </div>
                <div class="stat-card">
                    <h3>${largeScale}</h3>
                    <p>大型中转站</p>
                </div>
                <div class="stat-card">
                    <h3>${mediumScale}</h3>
                    <p>中型中转站</p>
                </div>
                <div class="stat-card">
                    <h3>${openSource}</h3>
                    <p>开源方案</p>
                </div>
            `;
        }

        function updateStats() {
            const filteredCount = filteredStations.length;
            stationCount.textContent = filteredCount;
        }

        function renderTable() {
            if (filteredStations.length === 0) {
                stationsTable.innerHTML = `
                    <tr>
                        <td colspan="8" class="no-results">
                            没有找到匹配的中转站
                        </td>
                    </tr>
                `;
                return;
            }
            
            stationsTable.innerHTML = filteredStations.map(station => {
                const veridropInfo = getVeridropInfo(station.name);
                const rateClass = getRateClass(station.rate_range);
                const categoryClass = getCategoryClass(station.category);
                const isSelected = selectedStations.has(station.id);
                
                return `
                    <tr class="${isSelected ? 'selected' : ''}">
                        <td class="checkbox-cell">
                            <input type="checkbox" class="station-checkbox compare-checkbox" 
                                   data-id="${station.id}" ${isSelected ? 'checked' : ''}>
                        </td>
                        <td>
                            <strong>${station.name}</strong>
                            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">
                                ${station.operation_time}
                            </div>
                        </td>
                        <td>
                            <span class="category-badge ${categoryClass}">
                                ${getCategoryName(station.category)}
                            </span>
                        </td>
                        <td>
                            <span class="stability-stars">${station.stability}</span>
                        </td>
                        <td>
                            <span class="rate-badge ${rateClass}">${station.rate_range}</span>
                        </td>
                        <td>
                            <div style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                ${station.models_supported.slice(0, 3).join(', ')}${station.models_supported.length > 3 ? '...' : ''}
                            </div>
                        </td>
                        <td>
                            ${veridropInfo ? `<span class="veridrop-badge">#${veridropInfo.rank} (${veridropInfo.score}分)</span>` : '-'}
                        </td>
                        <td>
                            <a href="${station.website}" target="_blank" class="website-link">访问</a>
                        </td>
                    </tr>
                `;
            }).join('');
            
            // Add event listeners to checkboxes
            document.querySelectorAll('.station-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const stationId = parseInt(this.dataset.id);
                    if (this.checked) {
                        selectedStations.add(stationId);
                    } else {
                        selectedStations.delete(stationId);
                    }
                    updateCompareButton();
                    
                    // Update select all checkbox
                    const allCheckboxes = document.querySelectorAll('.station-checkbox');
                    const checkedCount = document.querySelectorAll('.station-checkbox:checked').length;
                    selectAllCheckbox.checked = allCheckboxes.length === checkedCount;
                    selectAllCheckbox.indeterminate = checkedCount > 0 && checkedCount < allCheckboxes.length;
                });
            });
            
            updateStats();
        }

        function renderVeridrop() {
            veridropGrid.innerHTML = veridropData.top20_certified.map(item => `
                <div class="veridrop-card">
                    <div class="veridrop-rank">${item.rank}</div>
                    <h3>${item.name}</h3>
                    <div class="veridrop-score">${item.score}分</div>
                    <div class="veridrop-details">
                        <div class="veridrop-detail">
                            <span class="veridrop-detail-label">检测次数:</span>
                            <span class="veridrop-detail-value">${item.tests.toLocaleString()}</span>
                        </div>
                        <div class="veridrop-detail">
                            <span class="veridrop-detail-label">支持模型:</span>
                            <span class="veridrop-detail-value">${item.models.join(', ')}</span>
                        </div>
                        <div class="veridrop-detail">
                            <span class="veridrop-detail-label">最后检测:</span>
                            <span class="veridrop-detail-value">${item.last_test}</span>
                        </div>
                        <div class="veridrop-detail">
                            <span class="veridrop-detail-label">认证级别:</span>
                            <span class="veridrop-detail-value"><span class="veridrop-badge">${item.certification}</span></span>
                        </div>
                    </div>
                    <a href="${item.website}" target="_blank" class="website-link" style="display: block; margin-top: 15px; text-align: center;">
                        访问官网
                    </a>
                </div>
            `).join('');
        }

        function renderChart() {
            const categories = ['large-scale', 'medium-scale', 'open-source'];
            const counts = categories.map(cat => stations.filter(s => s.category === cat).length);
            const maxCount = Math.max(...counts);
            
            categoryChart.innerHTML = categories.map((cat, index) => {
                const height = (counts[index] / maxCount) * 250;
                return `
                    <div class="chart-bar" style="height: ${height}px;">
                        <div class="chart-value">${counts[index]}</div>
                        <div class="chart-label">${getCategoryName(cat)}</div>
                    </div>
                `;
            }).join('');
        }

        function updateCompareButton() {
            const count = selectedStations.size;
            compareCount.textContent = count;
            compareBtn.disabled = count < 2;
        }

        function showComparison() {
            if (selectedStations.size < 2) return;
            
            const selected = stations.filter(s => selectedStations.has(s.id));
            
            comparisonGrid.innerHTML = selected.map(station => `
                <div class="comparison-card">
                    <div class="comparison-card-header">
                        <h3>${station.name}</h3>
                        <button class="remove-card" onclick="removeFromComparison(${station.id})">&times;</button>
                    </div>
                    <div class="comparison-details">
                        <div class="detail-item">
                            <span class="detail-label">分类:</span>
                            <span class="detail-value">${getCategoryName(station.category)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">评分:</span>
                            <span class="detail-value">${station.stability}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">倍率:</span>
                            <span class="detail-value">${station.rate_range}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">运营时间:</span>
                            <span class="detail-value">${station.operation_time}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">支持模型:</span>
                            <span class="detail-value" style="font-size: 0.9rem;">${station.models_supported.slice(0, 4).join(', ')}${station.models_supported.length > 4 ? '...' : ''}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">适合场景:</span>
                            <span class="detail-value" style="font-size: 0.9rem;">${station.suitable_for.slice(0, 2).join(', ')}</span>
                        </div>
                        ${station.notes ? `
                        <div class="detail-item">
                            <span class="detail-label">备注:</span>
                            <span class="detail-value" style="font-size: 0.9rem;">${station.notes}</span>
                        </div>
                        ` : ''}
                    </div>
                    <a href="${station.website}" target="_blank" class="website-link" style="display: block; margin-top: 15px; text-align: center;">
                        访问官网
                    </a>
                </div>
            `).join('');
            
            comparisonView.style.display = 'block';
            comparisonView.scrollIntoView({ behavior: 'smooth' });
        }

        function removeFromComparison(stationId) {
            selectedStations.delete(stationId);
            updateCompareButton();
            
            // Update checkbox
            const checkbox = document.querySelector(`.station-checkbox[data-id="${stationId}"]`);
            if (checkbox) {
                checkbox.checked = false;
            }
            
            // Re-render comparison
            if (selectedStations.size >= 2) {
                showComparison();
            } else {
                comparisonView.style.display = 'none';
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.tab === tabName);
            });
            
            // Show/hide views
            document.getElementById('tableView').style.display = tabName === 'table' ? 'block' : 'none';
            document.getElementById('veridropView').style.display = tabName === 'veridrop' ? 'block' : 'none';
            document.getElementById('chartsView').style.display = tabName === 'charts' ? 'block' : 'none';
            
            // Hide comparison when switching tabs
            if (tabName !== 'table') {
                comparisonView.style.display = 'none';
            }
        }

        function toggleTheme() {
            isDarkTheme = !isDarkTheme;
            document.body.classList.toggle('dark-theme', isDarkTheme);
            themeToggle.textContent = isDarkTheme ? '☀️' : '🌙';
            localStorage.setItem('dark-theme', isDarkTheme);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('dark-theme');
            if (savedTheme === 'true') {
                isDarkTheme = true;
                document.body.classList.add('dark-theme');
                themeToggle.textContent = '☀️';
            }
        }
    </script>
</body>
</html>
